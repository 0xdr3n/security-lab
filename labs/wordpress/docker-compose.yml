# WordPress plugin-auditing lab.
# Copy .env.example to .env and set your own passwords before starting.
#   docker compose up -d   ->  http://<host>:8082
services:
  wp-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: ${WP_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD}
    volumes:
      - wp-db:/var/lib/mysql

  wp:
    image: wordpress:latest
    restart: unless-stopped
    depends_on: [wp-db]
    ports:
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp-html:/var/www/html

volumes:
  wp-db:
  wp-html:
